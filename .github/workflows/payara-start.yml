name: Payara Start Test

on:
  workflow_dispatch:

jobs:
  start-payara:
    runs-on: self-hosted

    steps:
      - name: Set PAYARA_HOME env
        shell: cmd
        run: set PAYARA_HOME=${{ secrets.PAYARA_HOME }}

      - name: Start Payara
        shell: cmd
        run: |
          echo Starting Payara...
          "%PAYARA_HOME%\bin\asadmin.bat" version
